<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Quoting & BOM Estimator Suite</title>
</head>
<body>
    <h1>Hoelscher Pricing Calculator</h1>
    <div>
        <label for="target-margin">Target Margin (%)</label>
        <input type="number" id="target-margin" value="30">
    </div>
    <div>
        <label for="door-style">Door Style</label>
        <select id="door-style" onchange="updateGlassOptions()">
            <option value="">Select Style</option>
            <option value="style1">Classic Door</option>
            <option value="style2">Modern Door</option>
        </select>
    </div>
    <div>
        <label for="glass-type">Glass Type</label>
        <select id="glass-type">
            <option value="">Select Glass</option>
        </select>
    </div>
    <div>
        <label for="finish-type">Finish Type</label>
        <select id="finish-type" onchange="toggleStainColor()">
            <option value="Unfinished">Unfinished</option>
            <option value="Pre-Finished">Pre-Finished</option>
        </select>
    </div>
    <div id="stain-color-container" style="display: none;">
        <label for="stain-color">Stain Color</label>
        <select id="stain-color">
            <option value="Mahogany">Mahogany</option>
            <option value="Walnut">Walnut</option>
        </select>
    </div>

    <script>
        function updateGlassOptions() {
            const doorStyle = document.getElementById('door-style').value;
            const glassDropdown = document.getElementById('glass-type');
            glassDropdown.innerHTML = '';
            if (doorStyle) {
                const option1 = document.createElement('option');
                option1.value = 'clear';
                option1.textContent = 'Clear Glass';
                const option2 = document.createElement('option');
                option2.value = 'frosted';
                option2.textContent = 'Frosted Glass';
                glassDropdown.appendChild(option1);
                glassDropdown.appendChild(option2);
            } else {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'Select Glass';
                glassDropdown.appendChild(option);
            }
        }

        function toggleStainColor() {
            const finishType = document.getElementById('finish-type').value;
            const container = document.getElementById('stain-color-container');
            if (finishType === 'Pre-Finished') {
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }
    </script>
</body>
</html>
